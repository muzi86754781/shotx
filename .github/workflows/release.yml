name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.9)'
        required: false
        default: '1.9.9'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.9"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与修复
            1. **「支持作者」界面优化**：
               - “作者心声”区域高度扩展一倍（增加至 230pt），内容支持内部纵向滚动查看；
               - 去除底部的“保存收款码到下载”按钮，保持界面极简干净。
            2. **「剪贴板历史」双击粘贴与置顶支持**：
               - 弹窗采用 `FloatingKeyPanel` 支持成为 Key Window，并在右上角新增图钉置顶按钮；
               - 修复手势冲突，记录上一个活跃应用程序，双击历史记录时自动切回目标应用并在光标位置真实键入粘贴（Cmd+V）。
            3. **翻译功能全链路修复**：
               - 修复浮窗因为 borderless 样式无法获取键盘输入焦点的系统缺陷，输入框和译文框点击即可获得焦点自由打字；
               - 完善“划词翻译”调用链路，无论从右键菜单还是快捷键触发，均能准确捕获光标划词填入并立即翻译；
               - “截图翻译”在 OCR 识别结束后确保自动呼出翻译浮窗，若未提取到文字也会弹出窗口方便手动输入。
            4. **滚动长截图重叠问题彻底根治**：
               - 彻底移除硬编码偏移量与盲猜 fallback 逻辑；
               - 扩大位移检索范围至 400 像素，重构全重叠区域（Overlap Slab）逐行比对与严格误差校验机制；
               - 仅当画面产生真实位移并高精度校验通过时才拼接新切片，杜绝文本行机械重复与重叠！

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
