name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.26)'
        required: false
        default: '1.9.26'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.26"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.26)
            1. **macOS 麦克风权限假弹窗与卡死彻底根治 (macOS)**：去除 NSSound 加载 CoreAudio 驱动组件，改用 AudioServicesPlaySystemSound(1108) 系统声音守护服务播放快门音，纯系统输出不触碰音频输入设备；拾色器覆盖窗体支持窗口焦点与本地事件监听，Tab/C/Space 切换颜色格式流畅响应且绝不死锁。
            2. **现代化 Fluent 悬浮提示框与快捷键解耦 (Windows)**：全面替代原生系统 MessageBox 阻塞弹窗，全域采用深色微透圆角 Toast 悬浮卡片，平滑淡入淡出，自动静默关闭，零系统叮咚声打扰；偏好设置中将“划词翻译”与“输入翻译”快捷键完全分离，支持独立自定义设置。
            3. **OCR 与翻译多平台引擎可配置与凭证持久化 (Windows & macOS)**：1:1 还原参考设计图布局，左侧引擎列表高亮选中与状态标，右侧配置 APP ID、Secret Key 等凭据，支持密码显示/隐藏切换、在线一键连通性验证与控制台快速申请链接。
            4. **修复保存图片时误触发“访问麦克风” (macOS)**：彻底根除保存截图或改图时调用底层 CoreAudio 引起的 TCC 麦克风权限误触发。
            5. **长截图滚轮穿透滚动与实时切片拼接 (Windows)**：长截图状态下滚轮消息自动穿透覆层并向底层实际窗口转发原生 WM_MOUSEWHEEL 滚轮消息，同时从实时屏幕设备上下文动态抓取最新滚动画面并自动无缝拼接。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
