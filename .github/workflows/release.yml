name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.32)'
        required: false
        default: '1.9.32'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.32"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.32)
            1. **Windows 端长截图实时预览与采样修复 (Windows)**：使用 UI 线程级高响应 DispatcherTimer 驱动动态采样循环与画布重绘，彻底解决异步线程访问 WPF UI 属性异常导致的预览区无变化问题。
            2. **长截图特征锚点智能宽容匹配 (Windows)**：自适应检测页面特征区域，全步长逐像素扫描与 Windows ClearType 抗锯齿容差提升至 22.0，滚轮滚动时预览区实时显示拼接图像、切片次数与长图总高度。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
