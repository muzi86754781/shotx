name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.34)'
        required: false
        default: '1.9.34'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.34"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.34)
            1. **Windows 端长截图重复表格行/列表防重影与全重叠区多行全局匹配 (Windows)**：采用零位移内点重合率守卫与全重叠区多行特征点联合校验算法，彻底解决高度相似列表/表格滚动时跨行误匹配导致的内容重复与右侧文字错位问题。
            2. **长截图鼠标悬浮弹窗消除与重叠区自愈擦除 (Windows)**：底部增量接缝拼接配合重叠区静止悬浮窗/瞬态气泡像素级自愈擦除，并主动拦截选区内误触划词与发送 `WM_MOUSELEAVE` 消除悬浮气泡，确保生成长图干净无弹窗残留。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
