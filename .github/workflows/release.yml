name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.6)'
        required: false
        default: '1.9.6'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.6"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与改进
            1. **支持作者页面与关于页面彻底消除滚动条**：
               - 支持作者弹窗重构为精美两列固定卡片，去除内部滚动条，明确标明收款码为微信赞赏码，支持快捷保存收款码与一键复制 QQ；
               - 关于 ShotX 采用独立现代化圆角卡片弹窗替代原生 credits 文本，彻底消除灰色滚动条。
            2. **所有消息提示（Toast）统一居中提醒**：
               - 软件内部所有的操作反馈、复制成功、截图完成等浮动提示全部统一移至屏幕物理正中心显示，视觉清晰醒目。
            3. **剪贴板历史浮窗重构与双击直接粘贴**：
               - 去除顶部多余系统窗口关闭栏，标题更名为“剪贴板历史”；
               - 支持在历史记录列表中双击任意一条记录，自动失焦并直接在光标所在输入位置粘贴内容（Cmd+V 智能合成）。
            4. **翻译窗口置顶保持与双向可编辑**：
               - 窗口置顶（图钉）选中后始终置顶显示在最上层；
               - 原文输入框和译文结果框均支持随意点击与自由编辑修改；
               - 划词翻译与截图翻译可无缝将内容识别并自动填入输入框立即翻译。
            5. **偏好设置新增 OCR 与翻译多平台服务配置**：
               - 文本识别（OCR）平台：支持 Apple Vision（系统离线默认）、百度智能云、有道智云、谷歌 Cloud Vision、腾讯云，可配置 API 密钥；
               - 文本翻译平台：支持谷歌翻译（免密钥默认）、百度通用翻译、有道智云、腾讯云机器翻译，可配置 App ID 与密钥。
            6. **快捷键设置顺序与状态栏右键菜单 100% 对齐**：
               - 偏好设置中的 14 种全局快捷键严格按照状态栏右键菜单顺序从上至下整齐排列，清晰直观。
            7. **长截图事件穿透与一键退出优化**：
               - 长截图模式下按 Esc 键或点击工具栏叉号（✕）立即直接关闭截图遮罩；
               - 框选区域内放行鼠标与滚轮事件，底层页面（浏览器/文档等）可自然原生流畅滚动，配合智能位移算法实时拼接长图并实时预览。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
