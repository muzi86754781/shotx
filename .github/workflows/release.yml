name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.10)'
        required: false
        default: '1.9.10'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.10"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与修复
            1. **长截图滚动预览与方向位移算法全面修复**：
               - 修正了位移匹配在坐标系上的反向偏移错误，实现了真正的累积底部锚点追踪；
               - 预览卡片自适应缩放展示整张长图，并在底部增加「实时长图 • {高度} px」动态徽章；
               - 定时采样与滚轮监听联动，不论是触控板手势、鼠标滚轮、滚动条拖拽还是键盘翻页均能丝滑拼接且绝不重叠。
            2. **代码签名指定需求（DR）优化，免去重复授权烦恼**：
               - 构建签名时显式指定稳定 Designated Requirement（`-r="=designated => identifier \"com.shotx.ShotX\""`）；
               - 解决 macOS TCC 系统数据库每次因二进制哈希变动而撤销屏幕录制与辅助功能权限的问题。
            3. **截图 OCR 与截图翻译全链路修复**：
               - 升级 Apple Vision 离线识别请求为支持中文的最新规范（Revision 3 / Revision 2），内置智能降级与重试机制；
               - 修复 `OverlayController` 闭包提前被释放导致的截图翻译不弹窗问题；
               - 即使截取纯色或无文字区域，也会自动呼出翻译窗口，绝无假死或无响应现象。
            4. **截图框选鼠标移动性能大幅提升**：
               - 取色器采用直接底层内存寻址（`CFDataGetBytePtr`），消除了每帧数以百次的位图裁剪与上下文分配；
               - 开启图层 GPU 加速，彻底告别鼠标来回移动时的卡顿。
            5. **翻译窗口默认清空上次输入**：
               - 从菜单或快捷键打开翻译窗口时自动清空历史残留内容，保持输入框整洁清爽。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
