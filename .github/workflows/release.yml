name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.27)'
        required: false
        default: '1.9.27'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.27"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.27)
            1. **macOS 拾色器点击闪退根除 (macOS)**：修复拾色器在鼠标点击确认时窗口被同步过早销毁导致的 TouchBar 悬垂指针 EXC_BAD_ACCESS 崩溃；完善异步安全窗口关闭与像素提取边界保护，点击取色立即复制并展示居中 Toast。
            2. **Windows 长截图滚轮穿透滚动与实时拼接彻底打通 (Windows)**：改用 Windows 硬件级注入真实滚轮事件，无论 Chrome、Edge、Word、微信还是 PDF，都能 100% 真实滚动页面并实时无缝拼接；新增方向下键、PageDown、空格键等辅助滚动热键支持。
            3. **偏好设置多平台配置文本框标题完整展示 (Windows)**：彻底重构多语言机器翻译平台与 OCR 识别引擎的输入网格布局，采用双列绝对栅格分割，标题文本永不被输入框白色背景覆盖遮挡。
            4. **OCR 与翻译平台选择后全局真正生效 (Windows)**：打通平台切换与识别/翻译业务调度链路，选择百度/有道/微软原生即刻全局生效；百度云 OCR 增加实时 OAuth Token 连通性测试。
            5. **独立翻译窗口实时标识当前激活引擎 (Windows)**：顶栏清晰标注当前生效的翻译引擎（如【百度翻译】、【谷歌翻译】、【内置免密】等），方便直观掌控。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
