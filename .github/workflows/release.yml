name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.25)'
        required: false
        default: '1.9.25'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.25"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.25)
            1. **声音录制自主控制 (Windows & macOS)**：启动声音录制后进入准备就绪状态，由用户自主点击“开始录制”、“暂停/继续”与“停止并保存”，不再自动强行录音。
            2. **拾色器 9×9 放大镜与格式切换 (Windows & macOS)**：macOS 端实现 9×9 像素网格、准星及颜色卡片预览；两端均支持通过快捷键（Tab / C / Space）循环切换 HEX、RGB、HSL、HEXA 格式。
            3. **翻译双向智能检测与结果互换 (Windows)**：自动检测中文翻译为英文、检测英文翻译为中文；点击互换按钮将译文框内容置入输入框并立即触发反向翻译。
            4. **剪贴板历史双击直接粘贴 (Windows)**：双击任意剪贴板历史记录直接模拟粘贴至记事本等当前外部软件光标所在处，带重试与修饰键释放保护。
            5. **设置中心分类选项卡无遮挡 (Windows)**：历史记录分类选项卡独占首行宽敞排列，“清空当前分类”移至搜索统计同行，彻底避免遮挡。
            6. **托盘右键菜单纯净展示 (Windows)**：全局快捷键默认全部留空供用户自主定义，未设置快捷键项不再显示“未设置”文本，视觉更干净统一。
            7. **历史记录卡片 1:1 对标 macOS (Windows)**：新增截图多媒体缩略图与视频角标，翻译记录支持中英文双语对照展示并可一键打开独立翻译窗口。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
