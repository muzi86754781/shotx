name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.5)'
        required: false
        default: '1.9.5'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.5"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与改进
            1. **快捷键设置支持独立清除**：
               - 偏好设置中的快捷键“重置”变更为“清除”，点击后可将对应的快捷键清空注销（显示为“未设置”），并新增“清空全部”与“恢复全部默认”快捷键功能。
            2. **更新检查全面迁移至官方新仓库**：
               - 彻底清理旧作者相关地址，所有版本检查与发布页统一对齐至 `github.com/muzi86754781/shotx/releases`。
            3. **屏幕录制支持按 Esc 随时取消**：
               - 在划选录制区域后呼出参数配置面板时，无论在界面内还是其他应用中，按下 `Esc` 键均可立即安全退出录制流程并关闭选区框。
            4. **全方位完善关于 ShotX 的功能介绍**：
               - 详细展示 ShotX 全能截图、圆角阴影调节、智能滚动长截图、截图 OCR、屏幕录制、麦克风录音、划词/截图/输入翻译、剪贴板历史管理与隐藏桌面图标等一系列完整特性。
            5. **图标右键菜单重构与名称规范**：
               - 严格遵循规范去除菜单项末尾的省略点，并按照全新次序排列：
                 全能截图、区域截图、上次区域截图、全屏截图、窗口截图、定时截图、截图OCR、从剪贴板贴图、改图-打开图片、改图-从剪贴板打开、拾色器、[分割线]、屏幕录制、声音录制、[分割线]、划词翻译、截图翻译、输入翻译、[分割线]、剪贴板历史、[分割线]、隐藏桌面图标、历史记录、[分割线]、支持作者、偏好设置、检查更新、关于 ShotX、退出 ShotX。
            6. **滚动长截图智能变化检测拼接**：
               - 长截图重构特征位图比对算法：截图区域内有滚动内容实际位移变化时才自动拼接长图，杜绝空滑动或无变化时的重复拼接。
            7. **翻译窗口全面精简与交互修复 (444.jpg)**：
               - 彻底去除窗口顶部的系统关闭栏，打造沉浸式极简无边框卡片；
               - 修复左上角置顶图钉，点击后切实切换置顶层级；
               - 右上角功能更正为“翻译历史记录”与“偏好设置”快捷入口；
               - 中间语言栏互换按钮（⇄）全面支持自动检测与指定语言互换，点击即交换原文与译文并重新翻译。
            8. **新增「支持作者」赞赏弹窗**：
               - 倾情讲述作者独立开发 ShotX 的不易与初心，展示作者 QQ: 285351298 与赞赏收款码（微信/支付宝），支持一键复制 QQ 与保存收款码图片。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
