name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.29)'
        required: false
        default: '1.9.29'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.29"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.29)
            1. **Windows 长截图选区内部滑动/滚轮无反应问题彻底解决 (Windows)**：隐藏全屏静态背景快照，选区内部纯透明（0 Alpha），实时无遮挡展现底层应用；选区内支持按住鼠标左键上下拖拽滑动翻页滚动、鼠标滚轮滚动、键盘方向下键以及空格键，底层页面流畅滚动并实时拼接。
            2. **长截图新增【⬇ 向下滚动】单步拼接与【▶ 自动长截】手势模式 (Windows)**：底部工具栏与侧边预览卡片新增一键向下滚动单步拼接与一键自动平滑滚动拼接，到达页面底部自动完成并提示。
            3. **底层窗口穿透与双重消息精准派发 (Windows)**：根据探测到的底层窗口句柄递归查找子容器，同时派发原生 WM_MOUSEWHEEL、WM_VSCROLL 以及全局低级鼠标钩子，保证 Chromium (Chrome/Edge)、Office Word、PDF、微信等所有窗口均能顺畅滚动与抓取。
            4. **选区边缘保护防蓝色边框混入 (Windows)**：抓取切片时自动向内收缩 2 物理像素，彻底避免选框的蓝色边线和四角控制点被误作为画面拼接。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
