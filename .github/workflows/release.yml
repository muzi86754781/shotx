name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.21)'
        required: false
        default: '1.9.21'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.21"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与修复
            1. **长截图重叠与反向滚动问题彻底修复**：
               - 重构核心匹配算法，改用长图累计底沿与新帧全高度特征比对；
               - 严格过滤向上反向滚动，反向或静止时绝对不误增切片；
               - 消除文字段落误匹配导致的叠影与行重复，拼接严密平滑。
            2. **失焦置顶窗口第 1 次点击直接响应关闭**：
               - 修复翻译窗口与剪贴板历史窗口在失焦置顶时需点 2 次才关闭的 AppKit 激活点击问题；
               - 实现点击即响应，无需多余激活点击。
            3. **截图标注区新增取消撤销（重做 / 下一步）与悬停提示**：
               - 在撤销按钮（上一步）后新增“下一步（重做）”按钮（支持 ⇧⌘Z 快捷键）；
               - 鼠标悬停在标注工具上方时实时展示工具名称及快捷键气泡（挪开或点击后自动隐藏）。
            4. **截图标注区前 8 个工具展开子工具栏**：
               - 矩形、椭圆、直线、箭头、画笔、马赛克、文字、步骤序号支持展开专属子工具面板；
               - 支持常用调色盘（6个高频色+色环）、大小滑块、不透明度滑块及工具专属选项（实心/圆角/曲线箭头/荧光笔/毛玻璃/字体样式等）。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
