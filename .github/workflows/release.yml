name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.4)'
        required: false
        default: '1.9.4'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.4"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次重大更新与功能完善
            1. **屏幕录制还原第一版极简选区交互**：
               - 打开屏幕录制时不再出现截图界面的放大镜、取色及标注栏，恢复为第一版极简黑色半透明框选层，框选释放后直接呼出原生录制参数面板。
            2. **文字提取 (OCR) 选区即时关闭与记录**：
               - 选定 OCR 区域后，识别完成立即关闭遮罩与选区窗口，自动写入剪贴板并在中央醒目提示，同时自动将识别文本归档至历史记录。
            3. **菜单栏“截图历史”正式更名为“历史记录”**：
               - 图标右键菜单及主窗口统一规范为“历史记录”。
            4. **长截图极简标注栏与实时侧边预览 (333.jpg)**：
               - 进入长截图模式后，标注栏仅保留“取消（✕）、保存（⬇）、确认（✓）”；
               - 选区侧边同步弹出长截图预览卡片，在截图区内滚动鼠标滚轮即可实时预览纵向拼接长图。
            5. **全新高颜值翻译浮窗与划词/截图翻译 (444.jpg)**：
               - 像素级还原 444.jpg 翻译卡片：置顶图钉、语言互换、清空编辑、双语朗读 TTS、一键复制、多服务商标牌。
               - 支持全局快捷键「划词翻译」（默认 `⌥T`）：在任何 App 中划选文字后按下快捷键，自动捕获并在翻译浮窗中即时呈现译文。
               - 支持「截图翻译」（默认 `⌥⌃T`）：屏幕框选文字区域后直接翻译。
            6. **新增「记录复制」剪贴板历史管理器**：
               - 自动记录文本与文件的复制历史，提供全局快捷键（默认 `⌥V`）一键呼出悬浮面板，支持实时搜索与批量/重复快速粘贴。
            7. **多合一全功能历史记录中心**：
               - 历史记录窗口全面升级，支持 7 大分类筛选（全部、截图、录屏、录音、提取文字、翻译、复制记录），支持分类搜索、独立播放、文件定位与一键清空。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
