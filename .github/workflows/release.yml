name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.3)'
        required: false
        default: '1.9.3'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.3"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次重大更新与功能完善
            1. **完善全部功能快捷键设置**：
               - 在偏好设置中为全部 11 种功能提供独立快捷键设置与重置按钮（区域截图、截取全屏、截取窗口、截取上一区域、提取文字 OCR、屏幕录制、音频录制、贴图置顶、拾色器、显示/隐藏桌面图标、全能截图），并提供「恢复全部默认快捷键」按钮。
            2. **区域截图阴影开关、圆角滑块与长截图 (222.jpg 像素级还原)**：
               - 选区上方蓝色栏左侧显示尺寸，右侧阴影开关控制截图是否自带外发光投影；阴影开关前新增可拖动圆角滑块（0~36px）自由调整截图四个角的圆角弧度。
               - 选区下方标注栏在取消（✕）与保存（⬇）之间加入长截图功能按钮（`[ ↕ ]`），支持点击一键开启滚动长截图。
            3. **「截取上一区域」功能完善**：
               - 重新截取上一次框选的屏幕坐标与尺寸，无需重复用鼠标手动划选。
            4. **全屏截图与窗口截图桌面居中提示**：
               - 截取全屏和截取窗口完成后，桌面正中央弹出清晰醒目的 HUD 提示，反馈更直观。
            5. **独立原生屏幕录制流程**：
               - 屏幕录制保持原有的高清取景框、倒计时与独立控制栏交互，不混用截图标注栏。
            6. **提取文字 (OCR) 快捷直达**：
               - 提取文字无需标注栏，框选区域释放鼠标后直接完成文字识别并拷贝到剪贴板，屏幕正中央弹出“已识别完成并复制到剪贴板”提示。
            7. **「显示/隐藏桌面图标」功能完善**：
               - 一键隐藏或恢复桌面上的所有文件图标，在录屏或展示时保持桌面整洁清爽。
            8. **截图格式自定义设置**：
               - 偏好设置中支持切换截图保存格式：PNG（无损高质量，默认）、JPG（体积轻巧）、HEIC（高效压缩）。
            9. **新增高品质录音功能**：
               - 新增音频录制功能（快捷键 `⌥A`），悬浮高颜值药丸胶囊实时显示录音时长与动态红点，支持一键停止并保存音频。
            10. **录屏与录音独立保存路径**：
                - 偏好设置中支持分别为屏幕录制和音频录制设置专属保存目录，录制完成后自动分类保存。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
