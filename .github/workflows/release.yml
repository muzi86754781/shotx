name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.12)'
        required: false
        default: '1.9.12'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.12"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }}

            #### 本次更新亮点与修复
            1. **长截图重叠问题彻底根除（1:1 像素级全重叠视口匹配）**：
               - 废弃低分辨率降采样比对，改用原生 1:1 设备像素级的视口级大带宽高精比对；
               - 采用真实滚动切片像素拼接，杜绝 Retina 屏幕因 pt/px 换算和降采样模棱两可引发的单行文字“跨行撞车”与上下重叠；
               - 锁定单次最大位移为视口高度 40%（保留 >= 60% 视口重叠），数学上完全杜绝文本行误判与反向滚动重叠，拼接严丝合缝。
            2. **截图框选鼠标移动极速优化（120 FPS 满帧丝滑）**：
               - 加入鼠标高频移动事件合并（Coalescing），适配 500Hz-1000Hz 电竞鼠标，不再阻塞主线程消息循环；
               - 静态快捷键 HUD 提示卡片采用离屏位图缓存（`cachedHUDImage`），彻底消除鼠标移动时每秒数千次 CoreText 文字排版开销；
               - 放大镜取色器直接进行 CGContext 硬件加速绘制，消除了每帧频繁创建和释放 NSImage 包装对象的负担。

            #### 下载安装
            下载下方的 `ShotX-${{ env.VERSION }}.dmg` 文件，双击打开并将 ShotX 拖入 Applications（应用程序）文件夹即可。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
