name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.33)'
        required: false
        default: '1.9.33'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.33"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.33)
            1. **Windows 端长截图无污染截屏与穿透拼接修复 (Windows)**：启用 `WDA_EXCLUDEFROMCAPTURE` 硬件级截屏隐藏与 `WS_EX_NOACTIVATE` 无焦点抢占机制，确保截屏不包含蒙层、工具栏及提示框，选区内滚轮、触摸板、拖动滚动条均可实时驱动右侧长截图预览拼接。
            2. **长截图垂直边缘梯度与活跃特征点匹配引擎 (Windows)**：自动剔除静止侧边栏与底部固定状态栏干扰，支持稀疏文字与复杂排版页面的无缝像素级对齐拼接。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
