name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.31)'
        required: false
        default: '1.9.31'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.31"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复 (v1.9.31)
            1. **Windows 长截图滚动高频连续采样拼接 (Windows)**：彻底消除单次抓取即停止的问题，新增 35ms 持续采样队列，与 Chromium 平滑滚动渲染完全同步，滚轮滚动过程中持续顺畅拼接。
            2. **长截图双锚点与全步长匹配算法 (Windows)**：双锚定区域（底部 55%~92% 与中部 25%~55%），采用逐像素全精度线性扫描，彻底避免次像素跳格导致的匹配丢失，大幅提升各类文档与网页的长图拼接成功率。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
