name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.24)'
        required: false
        default: '1.9.24'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9].*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="1.9.24"
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Building ShotX version: $VERSION ($TAG)"

      - name: Build App & DMG
        run: |
          chmod +x Scripts/*.sh
          export VERSION="$VERSION"
          ./Scripts/build-app.sh
          ./Scripts/make-dmg.sh

      - name: Verify Artifacts
        run: |
          ls -la dist/
          if [ ! -f "dist/ShotX-$VERSION.dmg" ]; then
            echo "Expected DMG not found: dist/ShotX-$VERSION.dmg"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShotX ${{ env.TAG }}
          body: |
            ### ShotX ${{ env.TAG }} (Windows & macOS)

            #### 📦 安装包下载
            - **Windows 安装包 (Setup)**: [ShotX-Windows-Setup-${{ env.VERSION }}.exe](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-Setup-${{ env.VERSION }}.exe)
            - **Windows 绿色便携版 (Portable)**: [ShotX-Windows-${{ env.VERSION }}-Portable.zip](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-Windows-${{ env.VERSION }}-Portable.zip)
            - **macOS 安装包 (DMG)**: [ShotX-${{ env.VERSION }}.dmg](https://github.com/muzi86754781/shotx/releases/download/${{ env.TAG }}/ShotX-${{ env.VERSION }}.dmg)

            #### 🚀 本次更新亮点与修复
            1. **Windows 区域截图标注工具栏**：9 个标注工具采用矢量几何图标，展开子工具栏统一下移至主工具栏下方，长截图与保存图标化，增强 OCR 识别与空结果友好提示。
            2. **Windows 拾色器优化**：进入拾色器模式自动隐藏引导卡片，界面纯净。
            3. **macOS 屏幕录制**：框选区域后无需点击确定/取消，直接显示录屏工具栏，保留 4 角拖拽手柄。
            4. **Windows 屏幕录制 5 大功能**：支持麦克风、系统声音、光标捕获、左右键点击波纹高亮、左下角圆形可拖拽摄像头预览。
            5. **Windows 声音录制**：窗体高度适中无遮挡，新增最小化功能。
            6. **Windows 翻译与划词**：划词翻译自动唤醒并提取选中文本，下拉框药丸美化与行对齐，右上角历史记录单例唤起设置中心对应项。
            7. **Windows 剪贴板历史**：双击记录直接粘贴至光标处，悬浮显隐操作图标，修复删除刷新与操作提示。
            8. **Windows 偏好设置中心**：全局快捷键设置/清除/恢复全面生效，移除多余按钮文案，独立搜索行并美化历史卡片。
            9. **Windows 托盘右键菜单**：1:1 对标 macOS，全项矢量图标，首项“全能截图”高亮蓝色药丸，快捷键精准靠右对齐。
          draft: false
          prerelease: false
          files: dist/ShotX-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
